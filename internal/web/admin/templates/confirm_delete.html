{{define "account-delete-confirm"}}<!doctype html>
<html lang="zh-CN">
<head>
  {{template "head" "确认删除账号 · Emby 账号管理"}}
</head>
<body>
<main class="auth-shell">
  <section class="auth-card danger-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">E</span>
      <span class="brand-copy"><strong>Emby 账号管理</strong><small>ACCESS CONSOLE</small></span>
    </div>
    <p class="eyebrow danger-eyebrow">危险操作</p>
    <h1 class="page-title">确认删除业务账号 {{.Account.Username}}</h1>
    <p class="page-lead">这会从 Emby 删除对应用户及其关联数据，且无法恢复。</p>
    <form method="post" action="/admin/accounts/{{.Account.ID}}/delete/confirm">
      <input type="hidden" name="csrf_token" value="{{.CSRFToken}}">
      <button class="danger btn-block" type="submit">确认永久删除</button>
    </form>
    <p class="auth-foot"><a href="/admin/accounts">取消并返回账号列表</a></p>
  </section>
</main>
</body>
</html>
{{end}}
