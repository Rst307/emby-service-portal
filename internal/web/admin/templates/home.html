{{define "home"}}<!doctype html>
<html lang="zh-CN">
<head>
  {{template "head" "Emby Service Portal"}}
</head>
<body>
<main class="auth-shell">
  <section class="auth-card">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">E</span>
      <span class="brand-copy"><strong>Emby Service Portal</strong><small>MEMBER ACCESS</small></span>
    </div>
    <p class="eyebrow">账户服务中心</p>
    <h1 class="page-title">欢迎使用</h1>
    <p class="page-lead">登录用户中心查看订阅状态，或使用邀请码注册、续费。</p>
    <div class="auth-actions">
      <a class="quick-link" href="/login">用户登录 <span>查看我的订阅 →</span></a>
      <a class="quick-link" href="/purchase">购买激活码 <span>选择订阅时长 →</span></a>
      <a class="quick-link" href="/register">邀请码注册 <span>创建 Emby 账号 →</span></a>
      <a class="quick-link" href="/renew">账号续费 <span>购买方案或使用邀请码 →</span></a>
    </div>
    <p class="auth-foot"><a href="/admin/login">管理员登录</a></p>
  </section>
</main>
</body>
</html>
{{end}}
