{{define "head"}}<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>{{.}}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%237c9cff'/%3E%3Cstop offset='1' stop-color='%23a879ff'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='14' fill='url(%23g)'/%3E%3Ctext x='32' y='45' font-family='Arial,sans-serif' font-size='36' font-weight='bold' fill='white' text-anchor='middle'%3EE%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="/static/app.css">
<script defer src="/static/app.js?v=4"></script>
{{end}}

{{define "admin-nav"}}
<header class="topbar">
  <div class="brand"><span class="brand-mark">E</span>Emby 账号管理</div>
  <nav class="nav-links">
    <a {{if eq .active "dashboard"}}class="active" {{end}}href="/admin/">控制台</a>
    <a {{if eq .active "accounts"}}class="active" {{end}}href="/admin/accounts">账号</a>
    <a {{if eq .active "invites"}}class="active" {{end}}href="/admin/invites">邀请码</a>
    <a {{if eq .active "settings"}}class="active" {{end}}href="/admin/settings">设置</a>
  </nav>
  <form class="logout-form" method="post" action="/admin/logout">
    <input type="hidden" name="csrf_token" value="{{.csrf}}">
    <button class="secondary" type="submit">退出登录</button>
  </form>
</header>
{{end}}

{{define "alerts"}}
{{if .Error}}<p class="alert error">{{.Error}}</p>{{end}}
{{if .Message}}<p class="alert success">{{.Message}}</p>{{end}}
{{end}}
