name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -shuffle=on ./...
      - name: Race test
        run: go test -race -count=1 ./...
      - name: Coverage
        run: |
          go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-linux:
    name: Build Linux amd64
    needs: test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch repository tags
        run: git fetch --tags --force origin
      - name: Determine next release version
        run: |
          LATEST_TAG="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          NEXT_VERSION="$(printf '%s\n' "$LATEST_TAG" | awk -F. '{print $1 "." $2 "." ($3 + 1)}')"
          if [ -z "$NEXT_VERSION" ]; then NEXT_VERSION="v1.0.0"; fi
          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"
          echo "Latest stable tag: ${LATEST_TAG:-<none>} -> next release: $NEXT_VERSION"
      - name: Build executable
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/Rst307/emby-service-portal/internal/buildinfo.Version=$NEXT_VERSION -X github.com/Rst307/emby-service-portal/internal/buildinfo.Commit=${GITHUB_SHA::7}" \
            -o dist/emby-service-portal-linux-amd64 ./cmd/emby-service-portal
          chmod 0755 dist/emby-service-portal-linux-amd64
          sha256sum dist/emby-service-portal-linux-amd64 \
            > dist/emby-service-portal-linux-amd64.sha256
      - name: Upload Linux executable
        uses: actions/upload-artifact@v7
        with:
          name: emby-service-portal-linux-amd64
          path: |
            dist/emby-service-portal-linux-amd64
            dist/emby-service-portal-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 30

  build-windows:
    name: Build Windows amd64
    needs: test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: windows
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Fetch repository tags
        run: git fetch --tags --force origin
      - name: Determine next release version
        run: |
          LATEST_TAG="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          NEXT_VERSION="$(printf '%s\n' "$LATEST_TAG" | awk -F. '{print $1 "." $2 "." ($3 + 1)}')"
          if [ -z "$NEXT_VERSION" ]; then NEXT_VERSION="v1.0.0"; fi
          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"
          echo "Latest stable tag: ${LATEST_TAG:-<none>} -> next release: $NEXT_VERSION"
      - name: Build executable
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false \
            -ldflags="-s -w -X github.com/Rst307/emby-service-portal/internal/buildinfo.Version=$NEXT_VERSION -X github.com/Rst307/emby-service-portal/internal/buildinfo.Commit=${GITHUB_SHA::7}" \
            -o dist/emby-service-portal-windows-amd64.exe ./cmd/emby-service-portal
          sha256sum dist/emby-service-portal-windows-amd64.exe \
            > dist/emby-service-portal-windows-amd64.exe.sha256
      - name: Upload Windows executable
        uses: actions/upload-artifact@v7
        with:
          name: emby-service-portal-windows-amd64
          path: |
            dist/emby-service-portal-windows-amd64.exe
            dist/emby-service-portal-windows-amd64.exe.sha256
          if-no-files-found: error
          retention-days: 30

  release-linux:
    name: Publish release
    if: ${{ github.event_name == 'push' || github.event_name == 'workflow_dispatch' }}
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - name: Fetch repository tags
        run: git fetch --tags --force origin
      - name: Determine next release version
        run: |
          LATEST_TAG="$(git tag -l 'v*' | grep -E '^v[0-9]+\.[0-9]+\.[0-9]+$' | sort -V | tail -n1 || true)"
          NEXT_VERSION="$(printf '%s\n' "$LATEST_TAG" | awk -F. '{print $1 "." $2 "." ($3 + 1)}')"
          if [ -z "$NEXT_VERSION" ]; then NEXT_VERSION="v1.0.0"; fi
          echo "NEXT_VERSION=$NEXT_VERSION" >> "$GITHUB_ENV"
          echo "Latest stable tag: ${LATEST_TAG:-<none>} -> next release: $NEXT_VERSION"
      - name: Download Linux executable
        uses: actions/download-artifact@v8
        with:
          name: emby-service-portal-linux-amd64
          path: dist
      - name: Download Windows executable
        uses: actions/download-artifact@v8
        with:
          name: emby-service-portal-windows-amd64
          path: dist
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$NEXT_VERSION" \
            dist/emby-service-portal-linux-amd64 \
            dist/emby-service-portal-linux-amd64.sha256 \
            dist/emby-service-portal-windows-amd64.exe \
            dist/emby-service-portal-windows-amd64.exe.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "Emby Service Portal $NEXT_VERSION" \
            --generate-notes
