name: quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Verify formatting
        run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './.git/*'))"
      - name: Verify dependencies
        run: go mod verify
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test -count=1 -shuffle=on ./...
      - name: Race test
        run: go test -race -count=1 ./...
      - name: Coverage
        run: |
          go test -covermode=atomic -coverpkg=./... -coverprofile=coverage.out ./...
          go tool cover -func=coverage.out
      - name: Static analysis
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@latest
          staticcheck ./...
      - name: Vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...

  build-linux:
    name: Build Linux amd64
    needs: test
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: "0"
      GOOS: linux
      GOARCH: amd64
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true
      - name: Build executable
        run: |
          mkdir -p dist
          go build -trimpath -buildvcs=false -ldflags='-s -w' \
            -o dist/emby-user-manager-linux-amd64 ./cmd/emby-user-manager
          chmod 0755 dist/emby-user-manager-linux-amd64
          sha256sum dist/emby-user-manager-linux-amd64 \
            > dist/emby-user-manager-linux-amd64.sha256
      - name: Upload Linux executable
        uses: actions/upload-artifact@v7
        with:
          name: emby-user-manager-linux-amd64
          path: |
            dist/emby-user-manager-linux-amd64
            dist/emby-user-manager-linux-amd64.sha256
          if-no-files-found: error
          retention-days: 30
